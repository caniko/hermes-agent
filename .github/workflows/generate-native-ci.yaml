# Simit workflow template: .simit/workflows/generate-native-ci.yaml.in
# Generated by simit. Manual edits will be reported as ci=drift.
name: Generate native diagnostic CI

on:
  pull_request:
    paths:
      - .github/workflows/generate-native-ci.yaml
      - simit.toml
      - .simit/workflows/**
      - scripts/ci/plan_python_tests.py
      - tests/scripts/ci/test_plan_python_tests.py
      - tests/ci/test_generation_artifact_coverage.py
      - tests/ci/test_upgrade_release_baseline.py

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regressions:
    name: Native CI regression contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up locked Python and test dependencies
        uses: ./.github/actions/setup-pm
        with:
          test-environment: 'true'
      - name: Run CI regression contracts
        env:
          HERMES_TEST_WORKERS: "1"
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/native-ci-regressions"
          git rev-parse HEAD > "$RUNNER_TEMP/native-ci-regressions/revision"
          status=0
          scripts/run_tests.sh tests/ci/test_generation_artifact_coverage.py \
            tests/ci/test_upgrade_release_baseline.py tests/scripts/ci/test_plan_python_tests.py \
            2>&1 | tee "$RUNNER_TEMP/native-ci-regressions/tests.log" || status=$?
          echo "$status" > "$RUNNER_TEMP/native-ci-regressions/exit-code"
          exit "$status"
      - name: Retain CI regression evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ci-regressions-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-ci-regressions
          if-no-files-found: error
          retention-days: 31

  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GENERATOR_REVISION: b9775c5a8335bbb85ea4c2eac20db4ae7c7dad83
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        max-jobs = 1
        cores = 2
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:
      - name: Generate with qualified immutable Simit
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/native-ci-generation"
          git worktree add --detach "$destination" HEAD
          git rev-parse HEAD > "$destination/source-revision"
          sha256sum simit.toml > "$destination/source-config.sha256"
          cd "$destination"
          nix run "github:caniko/simit/$GENERATOR_REVISION" -- init ci --platform github --ci-provider actions --runtime nix
          nix run "github:caniko/simit/$GENERATOR_REVISION" -- init ci --platform github --ci-provider actions --runtime nix --check --diff
          printf '%s\n' "$GENERATOR_REVISION" > generator-revision
          find .simit/workflows .github/workflows -type f -print0 | sort -z | xargs -0 sha256sum > generated.sha256
          sha256sum simit.toml >> generated.sha256
      - name: Retain generated adoption files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-ci-generation-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 31
          if-no-files-found: error
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/native-ci-generation/simit.toml
            ${{ runner.temp }}/native-ci-generation/.github/workflows/**
            ${{ runner.temp }}/native-ci-generation/.simit/workflows/**
            ${{ runner.temp }}/native-ci-generation/source-revision
            ${{ runner.temp }}/native-ci-generation/source-config.sha256
            ${{ runner.temp }}/native-ci-generation/generator-revision
            ${{ runner.temp }}/native-ci-generation/generated.sha256

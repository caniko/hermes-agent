[ci]
platform = "github"
provider = "actions"
runtime = "nix"
runner = "ubuntu-24.04"
nix_builds = [".#checks.x86_64-linux.target-job-lifecycle"]

[ci.nix_build]
only = true
timeout_minutes = 120
max_parallel = 1
max_jobs = 1
cores = 2
kvm = true
capture_results = true
# Provider upload timestamps can lose seconds from a nominal retention interval.
artifact_retention_days = 32
extra_env = { NIX_CONFIG = "log-lines = 3000" }
extra_setup = [
  "python3 scripts/test-qualify-job-lifecycle.py",
  "nix run github:caniko/simit/bbfef6f6674d9977d7504a0e9c66be39147d9400 -- init ci --platform github --ci-provider actions --runtime nix --check --diff",
]
post_build = ["python3 scripts/qualify-job-lifecycle.py retain"]
post_build_always = ["python3 scripts/qualify-job-lifecycle.py retain-diagnostics"]

[release.artifacts]
substituters = ["https://cache.nixos.org"]
trusted_public_keys = ["cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY="]
